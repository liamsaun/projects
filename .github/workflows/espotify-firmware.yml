name: ESPotify firmware

# Builds ESPotify for each board and uploads a single merged .bin per board
# (flash it at offset 0x0, e.g. with https://espflash.app/)

on:
  push:
    paths:
      - 'espotify/**'
      - '.github/workflows/espotify-firmware.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: esp32dev
            chip: esp32
            bootloader: '0x1000'
          - env: waveshare_c6_amoled_216
            chip: esp32c6
            bootloader: '0x0'
    defaults:
      run:
        working-directory: espotify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('espotify/platformio.ini') }}

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Build
        run: pio run -e ${{ matrix.env }}

      - name: Merge into one flashable image
        run: |
          B=.pio/build/${{ matrix.env }}
          FW=~/.platformio/packages/framework-arduinoespressif32
          esptool --chip ${{ matrix.chip }} merge-bin \
            -o espotify-${{ matrix.env }}-merged.bin \
            --flash-mode keep --flash-freq keep --flash-size keep \
            ${{ matrix.bootloader }} $B/bootloader.bin \
            0x8000 $B/partitions.bin \
            0xe000 $FW/tools/partitions/boot_app0.bin \
            0x10000 $B/firmware.bin

      - uses: actions/upload-artifact@v4
        with:
          name: espotify-${{ matrix.env }}
          path: |
            espotify/espotify-${{ matrix.env }}-merged.bin
            espotify/.pio/build/${{ matrix.env }}/firmware.bin
