; ESP32 + ST7735 1.8" TFT Dashboard
; Stack: TFT_eSPI + Sprites (zero-flicker)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^6.21.3
    bodmer/TJpg_Decoder @ ^1.1.0

; TFT_eSPI configuration via build flags (overrides User_Setup.h)
; This eliminates the need to manually edit User_Setup.h in the library
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160
    -DST7735_BLACKTAB=1
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=2
    -DTFT_RST=4
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=27000000

; Waveshare ESP32-C6-Touch-AMOLED-2.16
; 480x480 CO5300 AMOLED (QSPI) + CST9217 touch: tap = play/pause, swipe left/right = next/previous
; The ESP32-C6 needs Arduino-ESP32 3.3+, which comes from the pioarduino platform
[env:waveshare_c6_amoled_216]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.33/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

monitor_speed = 115200
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB

lib_deps =
    lovyan03/LovyanGFX @ ^1.2.7
    bblanchon/ArduinoJson @ ^6.21.3
    bodmer/TJpg_Decoder @ ^1.1.0

build_flags =
    -DBOARD_WAVESHARE_C6_AMOLED_216=1
    -DARDUINO_USB_CDC_ON_BOOT=1
